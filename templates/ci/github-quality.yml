name: Playbook Quality
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Add the project's locked dependency setup here before executing checks.
      - name: Run required PR checks
        run: python .testing-tools/quality.py run --stage pr
      - name: Verify evidence for this candidate
        run: python .testing-tools/quality.py verify --stage pr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testing-evidence
          path: .testing-results/
          include-hidden-files: true
  gate:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require completed verification
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
